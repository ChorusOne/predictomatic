[package]
name = "predictomatic"
version = "0.3.0"
edition = "2024"
authors = ["Chorus One <tech@chorus.one>"]
license = "Apache-2.0"
publish = false

[dependencies]
form_urlencoded = "1.2.1"
maud = "0.25.0"
serde = { version = "1", features = ["derive"] }
serde_plain = "1.0.2"
sqlite = "0.26.0"
sqlite3-sys = { version = "0.13.0", default-features = false }
tiny_http = "0.12.0"
toml = { version = "0.8.13", features = ["parse"], default-features = false }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
strip = true
